<style>
:root{--bg:#f6f4ef;--fg:#15151a;--mut:#62626e;--card:#fff;--line:rgba(0,0,0,.1);--warm:#e8472f;--cool:#0a8fb3;--g:linear-gradient(120deg,#ff5a45,#ffb347);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c12;--fg:#f3f1ea;--mut:#9a9aa8;--card:#15151d;--line:rgba(255,255,255,.1);--warm:#ff7a5c;--cool:#22d3ee}}
:root[data-theme="dark"]{--bg:#0c0c12;--fg:#f3f1ea;--mut:#9a9aa8;--card:#15151d;--line:rgba(255,255,255,.1);--warm:#ff7a5c;--cool:#22d3ee}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
.serif,h1,h2{font-family:Fraunces,Georgia,serif;font-weight:500}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px clamp(16px,4vw,48px);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.logo{font-family:Fraunces,serif;font-size:24px;letter-spacing:.14em;font-weight:500}
.logo b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:20px;font-size:14px}
nav a{color:var(--mut);text-decoration:none}nav a:hover{color:var(--fg)}
.tools{display:flex;gap:4px;align-items:center}
.tools button{border:1px solid var(--line);background:transparent;color:var(--mut);padding:5px 10px;border-radius:999px;font:inherit;font-size:12px;cursor:pointer}
.tools button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hero{position:relative;min-height:86vh;display:grid;place-items:center;text-align:center;padding:60px 20px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(500px circle at var(--mx,50%) var(--my,40%),rgba(255,120,70,.22),transparent 60%),radial-gradient(500px circle at calc(100% - var(--mx,50%)) calc(100% - var(--my,40%)),rgba(34,180,220,.2),transparent 60%)}
.fw{position:absolute;font-family:Fraunces,serif;font-size:clamp(18px,3vw,34px);color:var(--mut);opacity:.13;pointer-events:none;transition:transform .25s ease-out}
.fw span{display:block;animation:fl 7s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-14px) rotate(2deg)}}
.hc{position:relative;max-width:900px}
.tag{display:inline-block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg);border:1px solid var(--mut);border-radius:999px;padding:6px 16px;margin-bottom:28px}
h1{font-size:clamp(40px,8vw,92px);line-height:1;margin:0 0 24px;letter-spacing:-.02em}
h1 .w{background:linear-gradient(120deg,var(--warm),#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic}
h1 .s{background:linear-gradient(120deg,var(--cool),#7c6cf0);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic}
.sub{font-size:18px;line-height:1.6;color:var(--fg);opacity:.85;max-width:620px;margin:0 auto 32px}
.btn{display:inline-block;padding:14px 28px;border-radius:999px;font-weight:500;font-size:15px;text-decoration:none;border:1px solid var(--fg);color:var(--fg);cursor:pointer;background:transparent;font-family:inherit;transition:transform .2s}
.btn:hover{transform:translateY(-3px)}
.btn.p{background:var(--fg);color:var(--bg)}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
section{padding:90px clamp(16px,5vw,64px);max-width:1250px;margin:0 auto}
h2{font-size:clamp(30px,5vw,52px);margin:0 0 12px;letter-spacing:-.01em}
.lead{color:var(--mut);margin:0 0 44px;max-width:560px;line-height:1.6}
.split{display:flex;gap:16px;min-height:520px}
.pn{flex:1;border:1px solid var(--line);border-radius:28px;padding:32px;background:var(--card);cursor:pointer;transition:flex .6s cubic-bezier(.2,.8,.2,1),box-shadow .3s;overflow:hidden;position:relative}
.pn.act{flex:2.2;cursor:default}
.pn.t.act{box-shadow:0 0 0 1px var(--warm),0 20px 60px -20px var(--warm)}
.pn.c.act{box-shadow:0 0 0 1px var(--cool),0 20px 60px -20px var(--cool)}
.pn h3{font-family:Fraunces,serif;font-weight:500;font-size:28px;margin:0 0 10px}
.pn.t h3{color:var(--warm)}.pn.c h3{color:var(--cool)}
.pn p{color:var(--mut);line-height:1.6;margin:0 0 20px}
.pn .in{opacity:0;max-height:0;transition:opacity .4s .2s}
.pn.act .in{opacity:1;max-height:600px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chips button{border:1px solid var(--line);background:transparent;color:var(--fg);padding:8px 14px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.chips button.on{background:var(--warm);border-color:var(--warm);color:#fff}
.row{display:flex;gap:14px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line);min-height:52px}
.row b{font-size:11px;letter-spacing:.14em;color:var(--warm);width:28px;flex:none}
.row span{font-size:18px;line-height:1.4}
.row.ar{direction:rtl}.row.ar b{margin-left:14px}
.term{background:#0b0f17;color:#cfe8f0;border-radius:14px;padding:18px;font:13px/1.8 ui-monospace,Menlo,monospace;min-height:150px;white-space:pre-wrap}
.term i{color:#22d3ee;font-style:normal}
.cur::after{content:"▍";animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.un{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:28px;color:var(--mut);font-size:14px}
.un span.b{border:1px solid var(--line);border-radius:999px;padding:6px 16px;color:var(--fg);font-weight:600;letter-spacing:.08em}
.apps{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.stage{perspective:1000px;display:grid;place-items:center;padding:20px}
.phone{width:260px;height:490px;border-radius:38px;background:#111;padding:8px;box-shadow:0 40px 80px -20px rgba(0,0,0,.5);transition:transform .15s ease-out;transform-style:preserve-3d}
.scr{height:100%;border-radius:30px;background:linear-gradient(180deg,#14213d,#0b3a4a);padding:20px 16px;color:#fff;overflow:hidden;position:relative}
.scr h4{margin:6px 0 16px;font-size:15px}
.pin{width:46px;height:46px;border-radius:50%;background:#ff5a45;display:grid;place-items:center;margin:34px auto 22px;font-size:22px;position:relative}
.pin::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #ff5a45;animation:pu 2s infinite}
@keyframes pu{to{transform:scale(2.4);opacity:0}}
.sk{height:44px;border-radius:12px;background:rgba(255,255,255,.1);margin-bottom:10px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);animation:sh 2s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.ah{display:flex;gap:16px;align-items:center;margin:0 0 18px}.ah img{width:72px;height:auto;border-radius:16px}.ah b{font-size:28px;display:block;font-weight:500}.ah small{color:var(--mut)}
.phone img{width:100%;height:100%;border-radius:30px;display:block;object-fit:cover;object-position:top}
.ft{display:grid;gap:10px;margin:0 0 28px}.fb{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 18px;text-align:left;cursor:pointer;font:inherit;color:var(--fg);transition:.3s}.fb strong{display:block;font-weight:600}.fb span{display:block;color:var(--mut);font-size:14px;line-height:1.5;max-height:0;overflow:hidden;opacity:0;transition:max-height .4s,opacity .4s,margin .4s}.fb.on{border-color:#c62a1f;box-shadow:0 0 0 1px #c62a1f}.fb.on span{max-height:140px;opacity:1;margin-top:6px}
.next{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:60px}
.lock{border:1px dashed var(--line);border-radius:20px;padding:24px;text-align:center;color:var(--mut);transition:.3s;cursor:default}
.lock .q{font-size:34px;filter:blur(4px);transition:.3s}
.lock.fst img{width:96px;height:auto;border-radius:20px;display:block;margin:0 auto 10px}.lock.fst b{display:block;color:var(--fg);letter-spacing:.08em}.lock.fst{border-style:solid;border-color:var(--cool)}
.un span.b{letter-spacing:0!important;font-weight:500!important}
.lock:hover{border-color:var(--cool);color:var(--fg);transform:translateY(-4px)}
.lock:hover .q{filter:none}
.ct{text-align:center}
.mail{display:inline-block;font-family:Fraunces,serif;font-size:clamp(26px,6vw,64px);color:var(--fg);text-decoration:none;border-bottom:3px solid var(--warm);margin:10px 0 28px}
